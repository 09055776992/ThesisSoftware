version: '3.8'

services:
  # Main Node.js Backend
  backend:
    build: ./Backend
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
    env_file:
      - ./Backend/.env
    networks:
      - scholar-network

  # Python AI-Backend
  ai-backend:
    build: ./AI-Backend
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
    networks:
      - scholar-network

  # Frontend (optional, if needed)
  frontend:
    build: ./FrontEnd
    ports:
      - "5173:5173"
    networks:
      - scholar-network

networks:
  scholar-network:
    driver: bridge
